services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the compose network Mongo is reachable by its service name.
      MONGO_URI: mongodb://mongo:27017
    ports:
      - "8080:8080"   # REST
      - "50051:50051" # gRPC
    depends_on:
      mongo:
        condition: service_healthy
    stop_grace_period: 15s

volumes:
  mongo-data: